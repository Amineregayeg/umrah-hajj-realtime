name: umrah_hajj_flutter
description: Flutter frontend for Umrah & Hajj Realtime guidance mobile app
publish_to: 'none' # Prevent accidental publishing

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & Networking
  dio: ^5.4.3+1              # HTTP client with interceptors
  web_socket_channel: ^3.0.1 # WebSocket client

  # Authentication
  supabase_flutter: ^2.5.6   # Supabase auth SDK

  # Storage
  flutter_secure_storage: ^9.2.2  # Secure token storage
  hive: ^2.2.3                     # Local NoSQL database
  hive_flutter: ^1.1.0             # Hive Flutter extensions
  shared_preferences: ^2.2.3       # Simple key-value storage
  path_provider: ^2.1.3            # Path to app directories

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1  # Optional: for immutable models

  # Routing
  go_router: ^14.2.0          # Declarative routing (Navigator 2.0)

  # UI Components
  cached_network_image: ^3.3.1     # Image caching
  shimmer: ^3.0.0                  # Loading shimmer effect
  flutter_svg: ^2.0.10+1           # SVG support
  lottie: ^3.1.2                   # Lottie animations

  # Forms & Validation
  form_field_validator: ^1.1.0
  mask_text_input_formatter: ^2.9.0  # Input masks (phone, date)

  # Location & Sensors
  geolocator: ^12.0.0              # GPS location
  flutter_compass: ^0.8.0          # Compass sensor
  sensors_plus: ^5.0.1             # Accelerometer, gyroscope

  # Audio
  just_audio: ^0.9.39              # Audio player
  audio_session: ^0.1.21           # Audio session management

  # Internationalization
  intl: ^0.19.0                    # Date formatting, i18n
  flutter_localizations:
    sdk: flutter

  # Utilities
  logger: ^2.3.0                   # Logging utility
  equatable: ^2.0.5                # Value equality
  dartz: ^0.10.1                   # Functional programming (Either)
  connectivity_plus: ^6.0.3        # Network connectivity status
  url_launcher: ^6.3.0             # Launch URLs, phone calls
  permission_handler: ^11.3.1      # Runtime permissions
  package_info_plus: ^8.0.0        # App version info
  device_info_plus: ^10.1.0        # Device info

  # Optional: Maps (if custom map implementation needed)
  # google_maps_flutter: ^2.6.1
  # flutter_map: ^7.0.2  # Alternative: OpenStreetMap

  # Optional: Analytics & Crash Reporting
  # firebase_core: ^2.31.0
  # firebase_analytics: ^10.10.5
  # firebase_crashlytics: ^3.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0  # Stricter linting rules

  # Code Generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2  # Optional: for immutable models

  # Testing
  mockito: ^5.4.4              # Mocking framework
  mocktail: ^1.0.4             # Alternative mocking
  integration_test:
    sdk: flutter

  # Testing Utilities
  faker: ^2.1.0                # Generate fake data for tests

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/kaaba.png
    - assets/images/logo.png
    - assets/images/background_home.jpg
    - assets/offline/
    - assets/offline/navigation_bundle.json

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-Black.ttf
          weight: 900

  # Enable Material 3
  # (Set via ThemeData in code)

# Flutter code generation configuration
flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true
    lottie: true

# Analyzer configuration
analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# Linter rules (extends very_good_analysis)
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    unnecessary_this: true
    avoid_print: true
    prefer_single_quotes: true
    always_use_package_imports: true
